[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "postx-backend"
version = "0.1.0"
description = "PostX asynchronous Instagram publishing SaaS"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "apscheduler==3.11.2",
  "asyncpg==0.31.0",
  "celery[redis]==5.6.3",
  "cryptography==46.0.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "socksio==1.0.0",
  "orjson==3.11.7",
  "pydantic==2.13.4",
  "pydantic-settings==2.13.1",
  "pyjwt[crypto]==2.11.0",
  "python-multipart==0.0.22",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.15.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/modules/campaigns/service.py" = ["S311"]
"app/workers/publisher.py" = ["S311"]
"tests/*" = ["B017", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
